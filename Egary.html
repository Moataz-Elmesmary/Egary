<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>إيجاري | Egary — نظام إدارة الإيجارات</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%237c3aed'/%3E%3Cpath d='M10 21.5L24 9.5 38 21.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M13.5 24.5V36.5a2.5 2.5 0 0 0 2.5 2.5h16a2.5 2.5 0 0 0 2.5-2.5V24.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M17 32.5 22 27.5 25.5 30.5 31 24.5M26.5 24.5H31V29' stroke='%23fab219' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
/* =========================================================
   نظام إدارة الإيجارات — نظام التصميم (وضع فاتح، RTL)
   ألوان الرسوم من لوحة dataviz المرجعية المتحقَّق منها
   ========================================================= */
:root {
  --page: #f6f5fb;
  --surface: #ffffff;
  --ink: #16141f;
  --ink-sec: #4b4760;
  --muted: #6f6b85;
  --grid: #e7e5f0;
  --baseline: #c6c2d8;
  --border: rgba(31, 27, 54, 0.10);
  --accent: #7c3aed;
  --accent-weak: #ede9fe;
  --accent-ink: #6023c9;
  --brand-grad: linear-gradient(135deg, #a78bfa 0%, #7c3aed 45%, #4c1d95 100%);
  /* حالات — لا تُستخدم أبدًا كألوان سلاسل بيانات */
  --good: #0ca30c;
  --good-text: #006300;
  --good-wash: #e4f3e4;
  --warning: #fab219;
  --warning-text: #7a5600;
  --warning-wash: #fdf1d3;
  --serious: #ec835a;
  --serious-text: #96431f;
  --serious-wash: #fce9e1;
  --critical: #d03b3b;
  --critical-text: #a32c2c;
  --critical-wash: #fae3e3;
  --unknown-wash: #f0efec;
  --viz-series: #4a3aa7;
  --viz-track: #e4e0f8;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.05), 0 4px 16px rgba(11, 11, 11, 0.05);
  --font: "Segoe UI", "Segoe UI Arabic", Tahoma, system-ui, sans-serif;
}

/* ---------- الوضع الليلي: درجات مختارة على السطح الداكن (لوحة dataviz المرجعية) ---------- */
:root[data-theme="dark"] {
  --page: #0d0b14;
  --surface: #17141f;
  --ink: #f2f0f7;
  --ink-sec: #c4c0d4;
  --muted: #97929f;
  --grid: #2a2638;
  --baseline: #453f5c;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #a78bfa;
  --accent-weak: #2e2454;
  --accent-ink: #c4b5fd;
  --brand-grad: linear-gradient(135deg, #a78bfa 0%, #7c3aed 55%, #3b0f80 100%);
  --good: #2fb52f;
  --good-text: #8ad98a;
  --good-wash: #142e14;
  --warning: #fab219;
  --warning-text: #f0c96a;
  --warning-wash: #33290e;
  --serious: #ec835a;
  --serious-text: #f0a586;
  --serious-wash: #35211a;
  --critical: #e05252;
  --critical-text: #f09090;
  --critical-wash: #3a1818;
  --unknown-wash: #242422;
  --viz-series: #9085e9;
  --viz-track: #2c2560;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.35);
}
:root[data-theme="dark"] .btn-primary { background: #7c3aed; border-color: #7c3aed; color: #fff; }
:root[data-theme="dark"] .btn-primary:hover { background: #8b5cf6; border-color: #8b5cf6; }
:root[data-theme="dark"] .c-paid-imp { background: #14251a; }
:root[data-theme="dark"] .c-unknown,
:root[data-theme="dark"] .ev-unk {
  background: repeating-linear-gradient(45deg, #232321 0 6px, #1c1c1a 6px 12px);
}
:root[data-theme="dark"] .ev-ok { border-color: #275427; }
:root[data-theme="dark"] .ev-warn { border-color: #514012; }
:root[data-theme="dark"] .ev-bad { border-color: #5c2424; }
:root[data-theme="dark"] .tone-violet { background: #241f45; color: #b3a8f5; }
:root[data-theme="dark"] .brand-logo { box-shadow: 0 3px 12px rgba(167, 139, 250, 0.45); }
:root[data-theme="dark"] .qa-btn { box-shadow: 0 3px 10px rgba(167, 139, 250, 0.35); }

* { box-sizing: border-box; margin: 0; padding: 0; }
/* الاتجاه تحكمه سمة dir على <html> (rtl افتراضيًا، وltr للإنجليزية) — لا نفرضه هنا */
body {
  font-family: var(--font);
  background: var(--page);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
}
a { color: var(--accent-ink); }
button { font-family: inherit; }

/* ---------- الهيكل ---------- */
#app { display: flex; min-height: 100vh; }
.sidebar {
  width: 232px; flex-shrink: 0;
  background: var(--surface);
  border-inline-end: 1px solid var(--grid);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.brand { padding: 18px 16px 14px; border-bottom: 1px solid var(--grid); display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 42px; height: 42px; flex-shrink: 0; border-radius: 13px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--brand-grad);
  box-shadow: 0 5px 14px rgba(124, 58, 237, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  transition: transform 0.2s;
}
.brand:hover .brand-logo { transform: rotate(-4deg) scale(1.05); }
.brand-logo svg { width: 24px; height: 24px; }

/* أزرار التبديل (لغة/ثيم) في الشريط العلوي */
.top-toggle { border: 1px solid var(--border); background: var(--surface); }
.top-toggle:hover { border-color: var(--baseline); background: var(--surface); }
.top-toggle-lang { padding: 5px 11px; font-weight: 800; font-size: 12.5px; letter-spacing: 0.02em; }

/* ملخص الجانت */
.gantt-summary { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.gantt-hint { color: var(--muted); font-size: 11.5px; }
.gbar { cursor: pointer; }
.brand-name { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
.brand-sub { color: var(--muted); font-size: 11px; }
.nav { list-style: none; padding: 10px; flex: 1; }
.nav-link {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px;
  color: var(--ink-sec); text-decoration: none; font-size: 13.5px;
  margin-bottom: 2px;
}
.nav-link { position: relative; }
.nav-link:hover { background: var(--page); color: var(--ink); }
.nav-link.on { background: var(--accent-weak); color: var(--accent-ink); font-weight: 600; }
.nav-link.on::before {
  content: ''; position: absolute; inset-inline-start: -10px; top: 7px; bottom: 7px;
  width: 3.5px; border-radius: 99px; background: var(--accent);
}
.nav-ic { display: inline-flex; width: 17px; height: 17px; }
.nav-ic svg { width: 100%; height: 100%; }
.nav-badge {
  margin-inline-start: auto;
  background: var(--critical); color: #fff;
  font-size: 11px; font-weight: 700;
  border-radius: 99px; padding: 0 7px; line-height: 18px;
}
.sidebar-foot { padding: 12px 18px; color: var(--muted); font-size: 11.5px; border-top: 1px solid var(--grid); }

.main { flex: 1; min-width: 0; padding: 0 26px 40px; }
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0 10px; gap: 12px; flex-wrap: wrap;
}
.topbar-title { font-size: 13px; color: var(--muted); }
.topbar-ctx { color: var(--accent-ink); font-weight: 700; }
.topbar-side { display: flex; align-items: center; gap: 12px; }
.topbar-date { font-size: 12.5px; color: var(--muted); }

/* قائمة الإدخال السريع */
.qa-wrap { position: relative; }
.qa-btn { background: var(--brand-grad); border: none; box-shadow: 0 3px 10px rgba(124, 58, 237, 0.35); font-weight: 700; }
.qa-menu {
  display: none; position: absolute; top: calc(100% + 6px); inset-inline-end: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 10px 32px rgba(11, 11, 11, 0.14); z-index: 40;
  min-width: 200px; padding: 6px; flex-direction: column;
}
.qa-wrap.open .qa-menu { display: flex; }
.qa-item {
  border: none; background: transparent; text-align: start; cursor: pointer;
  padding: 9px 12px; border-radius: 7px; font-size: 13px; font-family: inherit; color: var(--ink);
}
.qa-item:hover { background: var(--accent-weak); color: var(--accent-ink); }
.qa-item:first-child { font-weight: 700; }

/* ---------- رأس الصفحة ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin: 6px 0 14px; flex-wrap: wrap; }
.page-title { font-size: 22px; font-weight: 700; }
.page-sub { color: var(--ink-sec); font-size: 13px; max-width: 640px; }
.page-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ---------- بطاقات ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 18px;
}
.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
.card-title { font-size: 14px; font-weight: 700; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.view > .grid-2:first-of-type { margin-top: 0; }

/* ---------- بطاقات المؤشرات ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tiles-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.tile {
  position: relative;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 13px 15px; display: flex; flex-direction: column; gap: 3px;
  transition: transform 0.12s, box-shadow 0.12s;
}
.tile-click { cursor: pointer; }
.tile-click:hover { border-color: var(--baseline); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(11, 11, 11, 0.09); }
.tile-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding-inline-end: 40px; }
.tile-label { color: var(--ink-sec); font-size: 12.5px; }
.tile-value-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tile-value { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
.tile-sub { color: var(--muted); font-size: 12px; }
.tile-spark { margin-top: 4px; }

/* أيقونة البطاقة الملونة */
.tile-ic {
  position: absolute; top: 12px; inset-inline-end: 12px;
  width: 32px; height: 32px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center;
}
.tile-ic .icon { width: 17px; height: 17px; }
.tone-accent   { background: var(--accent-weak); color: var(--accent-ink); }
.tone-good     { background: var(--good-wash); color: var(--good-text); }
.tone-warning  { background: var(--warning-wash); color: var(--warning-text); }
.tone-serious  { background: var(--serious-wash); color: var(--serious-text); }
.tone-critical { background: var(--critical-wash); color: var(--critical-text); }
.tone-violet   { background: #e9e6f9; color: #4a3aa7; }
.tone-neutral  { background: var(--unknown-wash); color: var(--ink-sec); }

/* مؤشر التغير ▲▼ */
.delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px;
}
.delta .icon { width: 11px; height: 11px; }
.delta-good { color: var(--good-text); background: var(--good-wash); }
.delta-bad { color: var(--critical-text); background: var(--critical-wash); }
.spark { display: block; height: 34px; width: 120px; }
.val-critical { color: var(--critical-text); }
.val-warning { color: var(--warning-text); }

/* ---------- شارات الحالة: لون + أيقونة + نص دائمًا ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 600;
  padding: 1px 8px; border-radius: 99px; white-space: nowrap;
}
.chip .icon { width: 12px; height: 12px; display: inline-flex; }
.chip .icon svg { width: 100%; height: 100%; }
.chip-good { background: var(--good-wash); color: var(--good-text); }
.chip-warning { background: var(--warning-wash); color: var(--warning-text); }
.chip-serious { background: var(--serious-wash); color: var(--serious-text); }
.chip-critical { background: var(--critical-wash); color: var(--critical-text); }
.chip-neutral { background: var(--unknown-wash); color: var(--ink-sec); }
.chip-unknown { background: var(--unknown-wash); color: var(--ink-sec); border: 1px dashed var(--baseline); }

/* ---------- لافتة الافتراض ---------- */
.banner {
  display: flex; gap: 10px; align-items: flex-start;
  border-radius: var(--radius); padding: 11px 14px; margin-bottom: 14px;
  font-size: 13px;
}
.banner .icon { width: 17px; height: 17px; flex-shrink: 0; margin-top: 2px; }
.banner .icon svg { width: 100%; height: 100%; }
.banner-warning { background: var(--warning-wash); color: var(--warning-text); border: 1px solid #f2dfae; }
.banner-warning a { color: inherit; font-weight: 700; }
.banner-info { background: var(--unknown-wash); color: var(--ink-sec); border: 1px dashed var(--baseline); }

/* ---------- شريط السلايسرز ---------- */
.slicers {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 9px 12px; margin-bottom: 14px;
}
.slicer-item .input { width: auto; min-width: 128px; padding: 6px 9px; font-size: 12.5px; }
.slicer-q .input { min-width: 230px; }
.slicer-count { margin-inline-start: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

/* كومبو بوكس ببحث */
.combo { position: relative; display: inline-flex; align-items: center; }
.combo-input { min-width: 168px; padding-inline-end: 24px; }
.combo-caret { position: absolute; inset-inline-end: 9px; color: var(--muted); font-size: 10px; pointer-events: none; }
.combo-menu {
  display: none; position: absolute; top: calc(100% + 4px); inset-inline-start: 0; z-index: 45;
  background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  box-shadow: 0 10px 30px rgba(11, 11, 11, 0.14);
  min-width: 100%; max-height: 280px; overflow-y: auto; padding: 4px;
}
.combo.open .combo-menu { display: block; }
.combo-item {
  display: block; width: 100%; text-align: start; border: none; background: transparent;
  padding: 7px 11px; border-radius: 6px; font-size: 12.5px; font-family: inherit;
  cursor: pointer; color: var(--ink); white-space: nowrap;
}
.combo-item:hover, .combo-item.hl { background: var(--accent-weak); color: var(--accent-ink); }
.combo-item.on { font-weight: 700; }
.combo-empty { padding: 9px 11px; color: var(--muted); font-size: 12px; }

/* ---------- صف المرشحات ---------- */
.filter-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.filter-label { color: var(--muted); font-size: 12.5px; }
.month-nav { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.month-name { min-width: 96px; text-align: center; font-weight: 600; font-size: 13px; }

/* ---------- أزرار ---------- */
.btn {
  border: 1px solid var(--border); background: var(--surface);
  color: var(--ink); border-radius: 8px; padding: 7px 14px;
  font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--baseline); }
.btn .icon { width: 14px; height: 14px; display: inline-flex; }
.btn .icon svg { width: 100%; height: 100%; }
.btn-primary { background: var(--accent-ink); border-color: var(--accent-ink); color: #fff; }
.btn-primary:hover { background: #164a89; border-color: #164a89; }
.btn-ghost { background: transparent; }
.btn-danger { background: var(--critical); border-color: var(--critical); color: #fff; }
.btn-icon {
  border: none; background: transparent; cursor: pointer;
  width: 28px; height: 28px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center; color: var(--ink-sec);
}
.btn-icon:hover { background: var(--page); }
.btn-icon .icon { width: 15px; height: 15px; display: inline-flex; }
.btn-icon .icon svg { width: 100%; height: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { border-radius: 99px; padding: 4px 12px; font-size: 12.5px; }
.seg-on { background: var(--accent-weak); border-color: var(--accent-weak); color: var(--accent-ink); font-weight: 700; }

/* ---------- الرسوم ---------- */
/* إحداثيات الرسم تُحسب يدويًا بمنطق LTR — تثبيت الاتجاه يمنع انعكاس مراسي النص في صفحة RTL */
.chart { width: 100%; height: auto; display: block; direction: ltr; }
.chart .hit { cursor: default; outline: none; }
.chart .hit:hover path, .chart .hit:focus path { filter: brightness(0.92); }
.hero-line { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 6px; flex-wrap: wrap; }
.hero-num { font-size: 30px; font-weight: 650; }
.hero-unit { color: var(--muted); }
.note-line { display: flex; align-items: center; gap: 6px; color: var(--ink-sec); font-size: 12.5px; margin-top: 8px; }
.note-line .icon { width: 14px; height: 14px; flex-shrink: 0; display: inline-flex; }
.note-line .icon svg { width: 100%; height: 100%; }
.note-critical { color: var(--critical-text); }

/* تلميح الرسوم والمصفوفة */
.viz-tip {
  position: fixed; z-index: 60; display: none;
  background: #242423; color: #fff;
  border-radius: 8px; padding: 8px 11px;
  font-size: 12px; line-height: 1.7; pointer-events: none;
  max-width: 260px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
}
.viz-tip b { font-weight: 700; }
.viz-tip i { color: #cfcdc4; font-style: normal; }

/* عدّاد */
.meter { position: relative; height: 8px; border-radius: 99px; overflow: hidden; margin-top: 8px; background: var(--accent-weak); }
.meter-fill { position: absolute; inset-inline-start: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; }

/* ---------- تنبيهات ---------- */
.alerts { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.alert {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; background: var(--page);
}
.alert:hover { border-color: var(--baseline); }
.alert-text { flex: 1; font-size: 13px; }
.alert-go { width: 14px; height: 14px; color: var(--muted); display: inline-flex; }
.alert-go svg { width: 100%; height: 100%; }

/* ---------- الجداول ---------- */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: start; color: var(--muted); font-weight: 600; font-size: 12px;
  padding: 10px 12px; border-bottom: 1px solid var(--grid);
  white-space: nowrap; background: var(--surface);
}
.table td { padding: 9px 12px; border-bottom: 1px solid var(--grid); vertical-align: middle; white-space: nowrap; }
.table tbody tr:last-child td { border-bottom: none; }
.table-mini { font-size: 12.5px; }
.table-mini th, .table-mini td { padding: 6px 9px; }
.table td { font-variant-numeric: tabular-nums; }
.row-click { cursor: pointer; }
.row-click:hover td { background: var(--page); }

/* ---------- مصفوفة التحصيل ---------- */
.matrix-wrap {
  overflow: auto; max-height: calc(100vh - 210px);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.matrix { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
.matrix th {
  position: sticky; top: 0; z-index: 3;
  background: var(--surface); color: var(--muted); font-weight: 600; font-size: 12px;
  padding: 9px 8px; border-bottom: 1px solid var(--baseline); text-align: center;
  min-width: 64px;
}
.matrix .sticky-col {
  position: sticky; inset-inline-start: 0; z-index: 2;
  background: var(--surface); text-align: start;
  border-inline-end: 1px solid var(--baseline);
  min-width: 150px; max-width: 190px;
  padding: 7px 12px;
}
.matrix thead .sticky-col { z-index: 4; }
.mx-unit { font-weight: 700; font-size: 13px; }
.mx-tenant { color: var(--muted); font-size: 11.5px; }
.mcell {
  text-align: center; cursor: pointer; position: relative;
  border-bottom: 1px solid var(--grid);
  height: 44px; min-width: 64px;
  transition: box-shadow 0.1s;
}
.mcell:hover, .mcell:focus { box-shadow: inset 0 0 0 2px var(--accent); outline: none; z-index: 1; }
.mcell-sym { font-size: 15px; font-weight: 700; }
.mcell-approx {
  position: absolute; top: 3px; inset-inline-end: 5px;
  font-size: 11px; font-weight: 700; color: var(--serious-text);
}
.c-paid { background: var(--good-wash); color: var(--good-text); }
.c-plate { background: var(--warning-wash); color: var(--warning-text); }
.c-paid-imp { background: #f0f8f0; color: var(--good-text); }
.c-paid-imp .mcell-sym { opacity: 0.85; border-bottom: 2px dotted var(--good); }
.c-partial { background: var(--warning-wash); color: var(--warning-text); }
.c-late { background: var(--critical-wash); color: var(--critical-text); }
.c-due { background: var(--surface); color: var(--accent-ink); box-shadow: inset 0 0 0 1.5px var(--accent-weak); }
.c-unknown {
  background: repeating-linear-gradient(45deg, #f5f4f1 0 6px, #ecebe6 6px 12px);
  color: var(--ink-sec);
}
.c-upcoming { background: var(--surface); color: var(--baseline); }
.c-history { background: var(--surface); color: var(--ink-sec); }
.c-orphan { background: var(--good-wash); color: var(--good-text); }
.c-none { background: var(--page); color: var(--muted); box-shadow: inset 0 0 0 1px var(--grid); }
.mx-totals td {
  position: sticky; bottom: 0; background: var(--surface);
  border-top: 1px solid var(--baseline); font-weight: 600; font-size: 11.5px;
  color: var(--ink-sec); text-align: center; padding: 8px 6px;
  white-space: nowrap;
}
.mx-totals .sticky-col { font-size: 12px; }
.mx-future { color: var(--muted); font-weight: 400; }
.mx-bhead td {
  background: var(--page); padding: 7px 12px;
  border-bottom: 1px solid var(--baseline); font-size: 12.5px;
  position: sticky; inset-inline-start: 0;
}
.mx-arr-h, .mx-arr { min-width: 90px; }
.mx-arr {
  text-align: center; font-size: 11.5px; font-weight: 600;
  border-bottom: 1px solid var(--grid); white-space: nowrap;
}
.mut { color: var(--muted); }

/* ---------- مخطط واجهة المبنى ---------- */
.bldgs { display: flex; flex-direction: column; gap: 16px; }
.bldg { border: 1px solid var(--grid); border-radius: 8px; padding: 12px 14px; }
.bldg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.bldg-area { color: var(--muted); font-size: 12px; margin-inline-start: auto; }
.elev { display: flex; flex-direction: column; gap: 5px; }
.flr { display: flex; align-items: center; gap: 10px; }
.flr-name { width: 64px; flex-shrink: 0; color: var(--muted); font-size: 11.5px; text-align: end; }
.flr-cells { display: flex; gap: 5px; flex-wrap: wrap; }
.evc {
  position: relative; border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 10px; font-size: 12px; font-weight: 600; font-family: inherit;
  cursor: pointer; min-width: 58px; text-align: center; background: var(--surface);
}
.evc:hover, .evc:focus { box-shadow: 0 0 0 2px var(--accent); outline: none; z-index: 1; }
.evc-approx { position: absolute; top: 0; inset-inline-end: 3px; font-size: 10px; color: var(--serious-text); }
.ev-ok { background: var(--good-wash); color: var(--good-text); border-color: #c9e6c9; }
.ev-warn { background: var(--warning-wash); color: var(--warning-text); border-color: #f2dfae; }
.ev-bad { background: var(--critical-wash); color: var(--critical-text); border-color: #f0c6c6; }
.ev-unk { background: repeating-linear-gradient(45deg, #f5f4f1 0 6px, #ecebe6 6px 12px); color: var(--ink-sec); }
.ev-due { background: var(--surface); color: var(--accent-ink); border-color: var(--accent-weak); }
.ev-emp { background: var(--page); color: var(--muted); }
.bldg-stat {
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  border-top: 1px solid var(--grid); margin-top: 10px; padding-top: 8px;
  font-size: 12px; color: var(--muted);
}
.bldg-stat b { color: var(--ink); margin-inline-start: 4px; font-variant-numeric: tabular-nums; }
.bldg-stat b.val-accent { color: var(--accent-ink); }
.bldg-stat b.val-critical { color: var(--critical-text); }
.grow { flex: 1; }
.val-accent { color: var(--accent-ink); }

/* رؤوس أقسام المباني في شاشة الوحدات */
.bsec-head { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; }
.bsec-head:first-child { margin-top: 0; }
.bsec-title { font-size: 15px; font-weight: 700; }
.bsec-area { color: var(--muted); font-size: 12px; }
.unit-tenant-line { color: var(--ink-sec); font-size: 13px; margin-bottom: 7px; }

/* سجل الحركة */
.acts { list-style: none; display: flex; flex-direction: column; gap: 7px; }
.act { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; border-bottom: 1px solid var(--grid); padding-bottom: 6px; }
.act:last-child { border-bottom: none; }
.act-t { color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* مفتاح رسم الجانت */
.gl-active { background: #2a78d6; }
.gl-soon { background: #ec835a; }
.gl-ended { background: #d03b3b; }
.gl-renewed { background: #c3c2b7; }
.gl-future { background: #cde2fb; }
.gantt-scroll { overflow-x: auto; }
.gantt-scroll .chart { min-width: 680px; }

/* نموذج سطري (إضافة مبنى) */
.form-inline { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.form-inline .input { width: auto; flex: 1; min-width: 150px; }

/* دليل الرموز */
.legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-inline-start: auto; }
.legend-block { margin-inline-start: 0; margin-top: 10px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-sec); }
.legend-swatch {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 5px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border);
}

/* ---------- بطاقات الوحدات ---------- */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.unit-card { cursor: pointer; }
.unit-card:hover { border-color: var(--baseline); }
.unit-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.unit-name { font-size: 16px; font-weight: 700; }
.unit-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.unit-tenant { color: var(--ink-sec); font-size: 13px; }
.unit-facts { display: flex; flex-direction: column; gap: 3px; }
.fact { display: flex; justify-content: space-between; font-size: 12.5px; }
.fact-k { color: var(--muted); }
.fact-v { font-weight: 600; font-variant-numeric: tabular-nums; }
.unit-flags { margin-top: 9px; color: var(--serious-text); font-size: 12px; display: flex; align-items: center; gap: 5px; }
.unit-flags .icon { width: 13px; height: 13px; display: inline-flex; }
.unit-flags .icon svg { width: 100%; height: 100%; }

/* ---------- الدرج الجانبي ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(11, 11, 11, 0.32);
  opacity: 0; transition: opacity 0.15s;
}
.overlay.open { opacity: 1; }
.drawer {
  position: absolute; top: 0; bottom: 0; inset-inline-end: 0;
  width: min(460px, 94vw);
  background: var(--surface);
  box-shadow: 0 0 40px rgba(11, 11, 11, 0.2);
  display: flex; flex-direction: column;
  transform: translateX(-14px); opacity: 0.6; transition: all 0.15s;
}
.overlay.open .drawer { transform: none; opacity: 1; }
.drawer-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px 12px; border-bottom: 1px solid var(--grid);
}
.drawer-head h3 { font-size: 16px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
.drawer-foot { display: flex; gap: 8px; padding: 13px 20px; border-top: 1px solid var(--grid); }
.drawer-sec { font-size: 13px; font-weight: 700; margin: 16px 0 8px; color: var(--ink-sec); }

.kv { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.kv-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
.kv-k { color: var(--muted); }
.kv-v { font-weight: 600; }

.contract-chain { display: flex; flex-direction: column; gap: 12px; }
.chain-item { border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px; }
.chain-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
.chain-span { color: var(--muted); font-size: 12px; margin-bottom: 7px; }
.issue-mini { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }

/* ---------- نماذج ---------- */
.form-grid { display: flex; flex-direction: column; gap: 11px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: 12.5px; color: var(--ink-sec); font-weight: 600; }
.field-hint { font-size: 11.5px; color: var(--muted); }
.input {
  border: 1px solid var(--baseline); border-radius: 8px;
  padding: 8px 11px; font-size: 13.5px; font-family: inherit;
  background: var(--surface); color: var(--ink); width: 100%;
}
.input:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
.radio-row { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; font-size: 13.5px; cursor: pointer; }
.radio-row input { margin-top: 4px; accent-color: var(--accent); }
.settings-block p { margin-bottom: 8px; color: var(--ink-sec); font-size: 13px; }
.years-preview { margin-top: 4px; }

/* ---------- جودة البيانات ---------- */
.issues-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.issue-card { display: flex; flex-direction: column; gap: 7px; }
.issue-done { opacity: 0.62; }
.issue-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.issue-ref { color: var(--muted); font-size: 12px; }
.issue-title { font-size: 14px; font-weight: 700; }
.issue-detail { color: var(--ink-sec); font-size: 12.5px; }
.issue-action { font-size: 12.5px; color: var(--ink); background: var(--page); border-radius: 7px; padding: 7px 10px; }
.issue-btns { display: flex; gap: 8px; margin-top: 2px; }

/* ---------- فارغ / إشعار ---------- */
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty-title { font-size: 15px; font-weight: 700; color: var(--ink-sec); margin-bottom: 4px; }
.empty-sub { font-size: 12.5px; }
.toast {
  position: fixed; top: 18px; right: 50%; transform: translateX(50%) translateY(-80px);
  z-index: 70; background: #242423; color: #fff;
  border-radius: 99px; padding: 9px 18px; font-size: 13px;
  transition: transform 0.2s; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
}
.toast.show { transform: translateX(50%) translateY(0); }
.toast-warning { background: var(--serious-text); }

/* ---------- أيقونة عامة ---------- */
.icon { display: inline-flex; width: 15px; height: 15px; vertical-align: -2px; }
.icon svg { width: 100%; height: 100%; }

/* ---------- استجابة ---------- */
@media (max-width: 920px) {
  #app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; border-inline-end: none; border-bottom: 1px solid var(--grid); }
  .nav { display: flex; overflow-x: auto; padding: 6px 10px; }
  .nav li { flex-shrink: 0; }
  .nav-label { font-size: 12px; }
  .sidebar-foot { display: none; }
  .brand { padding: 12px 16px 8px; border-bottom: none; }
  .main { padding: 0 14px 30px; }
  .grid-2 { grid-template-columns: 1fr; }
  .legend { margin-inline-start: 0; }
}

/* ---------- بطاقات الإنسايتس ---------- */
.insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 14px; }
.insight {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--surface); border: 1px solid var(--border);
  border-inline-start: 4px solid var(--accent);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 16px; cursor: default;
  transition: transform 0.12s, box-shadow 0.12s;
}
.insight[role="button"] { cursor: pointer; }
.insight[role="button"]:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(11, 11, 11, 0.09); }
.insight.tone-good { border-inline-start-color: var(--good); }
.insight.tone-warning { border-inline-start-color: var(--warning); }
.insight.tone-serious { border-inline-start-color: var(--serious); }
.insight.tone-critical { border-inline-start-color: var(--critical); }
.insight-ic {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.insight-ic .icon { width: 18px; height: 18px; }
.insight-num { font-size: 24px; font-weight: 750; letter-spacing: -0.01em; }
.insight-title { font-size: 13.5px; font-weight: 700; margin-top: 1px; }
.insight-text { color: var(--ink-sec); font-size: 12.5px; margin-top: 3px; }

/* دونات + مفتاحها */
.donut-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.donut { width: 148px; height: 148px; flex-shrink: 0; direction: ltr; }
.donut .hit { cursor: default; outline: none; }
.donut .hit:hover, .donut .hit:focus { filter: brightness(0.92); }
.donut-legend { list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.donut-legend li { display: flex; align-items: center; gap: 8px; }
.donut-legend .legend-swatch { border-radius: 4px; border: none; }

/* معالج إدخال الكشف */
.intake-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
.step-hint { color: var(--ink-sec); font-size: 13px; margin-bottom: 12px; }
.step-done { display: flex; align-items: center; gap: 6px; color: var(--good-text); font-size: 13.5px; }
.step-done .icon { width: 15px; height: 15px; }
.view > .card { margin-bottom: 14px; }
.bldg-owner { color: var(--ink-sec); font-size: 12px; }

/* حيوية عامة */
.card { transition: box-shadow 0.12s; }
.unit-card { transition: transform 0.12s, box-shadow 0.12s; }
.unit-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(11, 11, 11, 0.09); }

/* مصفوفة بلا صفوف: توجيه بدل شبكة فاضية */
.mx-empty { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.mx-empty .btn { margin-top: 8px; }

/* ---------- شريط وضع العمل في المصفوفة ---------- */
.mode-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.mode-seg {
  display: inline-flex; gap: 3px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 3px;
}
.mode-opt {
  border: none; background: transparent; cursor: pointer; font-family: inherit;
  padding: 8px 14px; border-radius: 8px; font-size: 12.5px; color: var(--ink-sec);
  display: inline-flex; align-items: center; gap: 6px;
}
.mode-opt .icon { width: 14px; height: 14px; }
.mode-opt.on { background: var(--accent-weak); color: var(--accent-ink); font-weight: 700; }

/* خلية فاضية: إظهار مكان الإدخال عند المرور */
.mcell.c-upcoming:hover .mcell-sym::before,
.mcell.c-none:hover .mcell-sym::before,
.mcell.c-due:hover .mcell-sym::before { content: '+'; color: var(--accent-ink); font-size: 15px; }

/* قائمة مين لم يسدد */
.unpaid-list { list-style: none; display: flex; flex-direction: column; }
.unpaid-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 8px 4px; border-bottom: 1px solid var(--grid); cursor: pointer; border-radius: 6px;
}
.unpaid-row:hover { background: var(--page); }
.unpaid-row:last-child { border-bottom: none; }
.unpaid-who { font-size: 13px; min-width: 0; }
.unpaid-unit { color: var(--muted); font-size: 12px; }
.unpaid-side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.unpaid-amt { font-weight: 700; font-variant-numeric: tabular-nums; }
.unpaid-total { margin-top: 10px; font-size: 13px; color: var(--ink-sec); }

/* صفوف السداد الجماعي */
.bulk-row {
  display: flex; align-items: center; gap: 10px; padding: 7px 4px;
  border-bottom: 1px solid var(--grid); cursor: pointer; font-size: 13px;
}
.bulk-row input { accent-color: var(--accent); width: 16px; height: 16px; }
.bulk-name { flex: 1; }
.bulk-amt { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- دليل الشرح ---------- */
.sec-title { font-size: 16px; font-weight: 800; margin: 20px 0 12px; }
.doc-sec { margin-bottom: 14px; }
.doc-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
.doc-sub { color: var(--ink-sec); font-size: 13px; margin-bottom: 12px; }
.doc-items { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 10px; }
.doc-item { border: 1px solid var(--grid); border-radius: 9px; padding: 11px 13px; background: var(--page); }
.doc-name { font-weight: 700; font-size: 13.5px; margin-bottom: 7px; color: var(--accent-ink); }
.doc-row { display: flex; gap: 8px; font-size: 12.5px; margin-bottom: 4px; align-items: baseline; }
.doc-k {
  flex-shrink: 0; width: 52px; color: var(--muted); font-size: 11px; font-weight: 700;
}
.doc-ex { background: var(--accent-weak); border-radius: 6px; padding: 5px 8px; margin-top: 6px; }
.doc-ex .doc-k { color: var(--accent-ink); }

/* خريطة العملية */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.flow-step { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--grid); border-radius: 9px; padding: 11px 13px; }
.flow-num {
  width: 26px; height: 26px; border-radius: 99px; flex-shrink: 0;
  background: linear-gradient(135deg, #2a78d6, #1c5cab); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
}
.flow-t { font-size: 13.5px; }
.flow-d { color: var(--ink-sec); font-size: 12.5px; margin-top: 2px; }

/* ---------- صقل شامل للصفحات ---------- */
/* لينك الدليل في القائمة الجانبية */
.nav-docs {
  display: flex; align-items: center; gap: 10px;
  margin: 6px 10px; padding: 9px 12px; border-radius: 8px;
  color: var(--accent-ink); text-decoration: none; font-size: 13px; font-weight: 600;
  border: 1px dashed var(--baseline);
}
.nav-docs:hover { background: var(--accent-weak); border-style: solid; }

/* أفاتار المستأجرين */
.tenant-cell { display: inline-flex; align-items: center; gap: 9px; font-weight: 600; }
.avatar {
  width: 30px; height: 30px; border-radius: 99px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800;
}
.av-a { background: var(--accent-weak); color: var(--accent-ink); }
.av-b { background: var(--good-wash); color: var(--good-text); }
.av-c { background: #e9e6f9; color: #4a3aa7; }
.av-d { background: var(--warning-wash); color: var(--warning-text); }
.av-e { background: var(--serious-wash); color: var(--serious-text); }
:root[data-theme="dark"] .av-c { background: #241f45; color: #b3a8f5; }

/* حدود خطورة على بطاقات الجودة */
.issue-card { border-inline-start: 4px solid var(--baseline); }
.issue-card.sev-critical { border-inline-start-color: var(--critical); }
.issue-card.sev-high { border-inline-start-color: var(--serious); }
.issue-card.sev-medium { border-inline-start-color: var(--warning); }
.issue-card.sev-low { border-inline-start-color: var(--baseline); }

/* أرقام خطوات معالج الكشف */
.step-card { position: relative; }
.step-card::before {
  content: attr(data-step);
  position: absolute; top: 14px; inset-inline-end: 16px;
  width: 30px; height: 30px; border-radius: 99px;
  background: var(--accent-weak); color: var(--accent-ink);
  font-weight: 800; font-size: 14px;
  display: flex; align-items: center; justify-content: center;
}

/* جداول داخل البطاقات تلفّ بسكرول خاص بها بدل كسر العرض */
.mini-scroll { overflow-x: auto; max-width: 100%; }

/* =========================================================
   لوحة v3: سطر المحفظة + بطاقات المشاريع + داخل/خارج + الألارم
   ========================================================= */
.hero-strip {
  display: flex; flex-wrap: wrap; gap: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  margin-bottom: 14px; overflow: hidden;
}
.hero-item {
  flex: 1; min-width: 128px; padding: 14px 18px;
  border-inline-end: 1px solid var(--grid);
  display: flex; flex-direction: column; gap: 2px; cursor: default;
  transition: background 0.15s;
}
.hero-item[role="button"], .hero-item[onclick] { cursor: pointer; }
.hero-item:hover { background: var(--page); }
.hero-item:last-child { border-inline-end: none; }
.hero-k { color: var(--muted); font-size: 11.5px; font-weight: 600; }

    const t = new Date(Date.UTC(y, m - 1 + n, 1));
    return t.getUTCFullYear() + '-' + String(t.getUTCMonth() + 1).padStart(2, '0');
  }
  function yearsFrom(startIso, nYears, rent0, incPct) {
    const out = []; let r = rent0, from = startIso;
    for (let i = 0; i < nYears; i++) {
      const [y, m, dd] = from.split('-').map(Number);
      const to = new Date(Date.UTC(y + 1, m - 1, dd)); to.setUTCDate(to.getUTCDate() - 1);
      out.push({ from, to: to.toISOString().slice(0, 10), rent: Math.round(r / 50) * 50, estimated: false });
      from = new Date(Date.UTC(y + 1, m - 1, dd)).toISOString().slice(0, 10);
      r *= 1 + incPct;
    }
    return out;
  }

      phone: '01' + pick(['0', '1', '2']) + String(ri(10000000, 99999999)), note: '',
    });
    const mkC = (start, nY, r0, prevId) => {
      const cid = 'C' + (++cn);
      const years = yearsFrom(start, nY, r0, 0.10);
      contracts.push({
        id: cid, unitId: uid, tenantId: tid, start, end: years[years.length - 1].to,
        prevId: prevId || null, dueDay: def.dd || 1,
        maintenance: def.mnt || 0, vat: !!def.vat,
        years, deposit: { amount: Math.round(r0 * 2 / 100) * 100, status: 'held', note: '' },
        source: 'entered',
      });
      return contracts[contracts.length - 1];
    };
    let cList = [];
    if (def.renewedAt) {
      const c1 = mkC(def.start, def.renewedAt, def.r);
      const start2 = periodAdd(c1.end.slice(0, 7), 1) + '-01';
      const c2 = mkC(start2, 2, def.r * 1.15, c1.id);
      cList = [c1, c2];
    } else {
      cList = [mkC(def.start, def.yrs || 3, def.r)];
    }
    // توليد الدفعات من يناير 2025 (أو بداية العقد إن كانت أحدث) حتى اليوم
    const prof = def.prof || 'A';
    for (const c of cList) {
      let p = c.start.slice(0, 7) < '2025-01' ? '2025-01' : c.start.slice(0, 7);
      for (; p <= NOW && p <= c.end.slice(0, 7); p = periodAdd(p, 1)) {
        if (p === NOW) break; // شهر أغسطس الجاري لم يستحق سداده بعد في العرض
        const y = c.years.find(v => v.from.slice(0, 7) <= p && p <= v.to.slice(0, 7)) || c.years[0];
        let total = y.rent + (c.maintenance || 0);
        if (c.vat) total = Math.round(total * 1.14);
        let amount = total, dayOff = ri(0, 2), skip = false;
        if (prof === 'B') dayOff = ri(9, 18);
        if (prof === 'C') {
          if (p >= '2026-06') skip = true;
          else if (p === '2026-05') { amount = Math.round(total * 0.6 / 100) * 100; dayOff = ri(3, 9); }
        }
        if (prof === 'D' && p >= '2026-03') skip = true;
        if (skip) continue;
        const dd = Math.min(28, (c.dueDay || 1) + dayOff);
        payments.push({
          id: 'P' + (++pn), contractId: c.id, unitId: uid, period: p,
          amount, date: p + '-' + String(dd).padStart(2, '0'),
          method: pick(['نقدًا', 'نقدًا', 'إنستاباي', 'تحويل بنكي', 'شيك']),
          receiptNo: 'R-' + p.slice(2, 4) + p.slice(5, 7) + '-' + ri(100, 999),
          notes: '', source: 'entered',
        });
      }
    }
  }

  <script>
/* =========================================================
   store.js — الحالة، الحفظ المحلي، ومحرّك الاستحقاق
   مبدأ حاكم: الحالة محسوبة لا مكتوبة، والنظام يفرّق بين
   «متأخر مؤكَّد» و«غير موثَّق» — الورق لا يفرّق بينهما.
   ========================================================= */
(function () {
  'use strict';

  const LS_KEY = 'skr-rms-v4';
  const DAY = 24 * 60 * 60 * 1000;

  /* ---------- أدوات تاريخ (كلها UTC لتفادي انزياح المناطق الزمنية) ---------- */
  function d(iso) { // 'YYYY-MM-DD' → Date (UTC)
    const [y, m, dd] = iso.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, dd));
  }
  function iso(date) {
    return date.toISOString().slice(0, 10);
  }
  function today() {
    const n = new Date();
    return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
  }
  function monthFirst(period) { return d(period + '-01'); }
  function monthLast(period) {
    const [y, m] = period.split('-').map(Number);
    return new Date(Date.UTC(y, m, 0));
  }
  function daysInMonth(period) { return monthLast(period).getUTCDate(); }
  function periodOf(date) {
    return date.getUTCFullYear() + '-' + String(date.getUTCMonth() + 1).padStart(2, '0');
  }
  function addMonths(period, n) {
    const [y, m] = period.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1 + n, 1));
    return periodOf(t);
  }
  function cmpPeriod(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function daysBetween(a, b) { return Math.round((b - a) / DAY); }

  const MONTHS_AR = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
                     'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  function periodLabel(period, withYear) {
    const [y, m] = period.split('-').map(Number);
    return MONTHS_AR[m - 1] + (withYear ? ' ' + y : '');
  }

  /* ---------- تحميل/حفظ الحالة ---------- */
  let STATE = null;
  const listeners = [];

  function freshFromSeed() {
    return JSON.parse(JSON.stringify({
      meta: SEED.meta, settings: SEED.settings, buildings: SEED.buildings,
      tenants: SEED.tenants, units: SEED.units, contracts: SEED.contracts,
      marks: SEED.marks, payments: SEED.payments, complaints: SEED.complaints,
      issues: SEED.issues, log: SEED.log || [], seedVersion: SEED.version,
    }));
  }
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.seedVersion === SEED.version) { STATE = parsed; return; }
      }
    } catch (e) { /* تخزين تالف → بذرة جديدة */ }
    STATE = freshFromSeed();
    save();
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(STATE)); } catch (e) { /* تخزين ممتلئ */ }
  }
  function commit() { save(); listeners.forEach(fn => fn()); }
  function subscribe(fn) { listeners.push(fn); }
  function resetData() { STATE = freshFromSeed(); commit(); }

  /* سجل الحركة — كل عملية إدخال تُسجَّل بوقتها */
  function logAct(txt) {
    STATE.log.unshift({ at: new Date().toISOString().slice(0, 16).replace('T', ' '), txt });
    if (STATE.log.length > 60) STATE.log.pop();
  }

  /* ---------- فهارس ---------- */
  function building(id) { return STATE.buildings.find(b => b.id === id) || null; }
  function unit(id) { return STATE.units.find(u => u.id === id) || null; }
  function tenant(id) { return STATE.tenants.find(t => t.id === id) || null; }
  function contract(id) { return STATE.contracts.find(c => c.id === id) || null; }
  function unitContracts(unitId) {
    return STATE.contracts.filter(c => c.unitId === unitId)
      .sort((a, b) => a.start < b.start ? -1 : 1);
  }
  function nextContract(c) {
    return STATE.contracts.find(x => x.prevId === c.id) || null;
  }
  function activeContractOn(unitId, date) {
    return unitContracts(unitId).find(c => d(c.start) <= date && date <= d(c.end)) || null;
  }
  function contractsOverlappingMonth(unitId, period) {
    const f = monthFirst(period), l = monthLast(period);
    return unitContracts(unitId).filter(c => d(c.start) <= l && d(c.end) >= f);
  }
  function unitsIn(uset) {
    return uset ? STATE.units.filter(u => uset.has(u.id)) : STATE.units;
  }

  /* ---------- محرّك الاستحقاق ----------
     قيمة الإيجار مربوطة بسنة العقد: الشهر الذي يقطع سنتَي عقد
     يُحسب باليوم على القيمتين. rentBasis سنوي ⇒ القيمة ÷ 12.
     الاستحقاق الشهري = إيجار + صيانة (البند الرابع) + ض.ق.م إن كان العقد خاضعًا (البند العاشر). */
  function monthlyRate(rent) {
    return STATE.settings.rentBasis === 'annual' ? rent / 12 : rent;
  }
  function dueForMonth(c, period) {
    const f = monthFirst(period), l = monthLast(period), dim = daysInMonth(period);
    let rentAmt = 0, estimated = false, covered = 0;
    for (const y of (c.years || [])) {
      const a = d(y.from) > f ? d(y.from) : f;
      const b = d(y.to) < l ? d(y.to) : l;
      if (a > b) continue;
      const days = daysBetween(a, b) + 1;
      covered += days;
      rentAmt += monthlyRate(y.rent) * (days / dim);
      if (y.estimated) estimated = true;
    }
    if (covered === 0) return null;
    const mnt = (c.maintenance || 0) * (covered / dim);
    let amount = rentAmt + mnt, vat = 0;
    if (c.vat) { vat = amount * (STATE.settings.vatPct / 100); amount += vat; }
    return {
      amount: Math.round(amount), rent: Math.round(rentAmt),
      maintenance: Math.round(mnt), vat: Math.round(vat),
      estimated, coveredDays: covered, fullMonth: covered === dim,
    };
  }
  /* يوم الاستحقاق داخل الشهر (افتراضيًا أول الشهر) */
  function dueDateOf(c, period) {
    const dd = c && c.dueDay ? Math.min(c.dueDay, daysInMonth(period)) : 1;
    return d(period + '-' + String(dd).padStart(2, '0'));
  }

  /* ---------- سداد شهر لوحدة ---------- */
  function paymentsFor(unitId, period) {
    return STATE.payments.filter(p => p.unitId === unitId && p.period === period);
  }
  function markFor(unitId, period) {
    return STATE.marks.find(m => m.unitId === unitId && m.period === period) || null;
  }

  /* الحالة المركّبة لشهر × وحدة — قلب النظام كله */
  function cellInfo(unitId, period, asOf) {
    asOf = asOf || today();
    const cov = STATE.meta.importCoverage;
    const u = unit(unitId);
    const cs = contractsOverlappingMonth(unitId, period);
    const c = cs[0] || null;
    const due = c ? dueForMonth(c, period) : null;
    // دفعة مختومة بعقد متداخل آخر لا تُحسب على عقد هذا الشهر — لكل عقد دفعاته
    const pays = paymentsFor(unitId, period)
      .filter(p => !p.contractId || !c || p.contractId === c.id || !cs.some(cc => cc.id === p.contractId));
    const entered = pays.reduce((s, p) => s + (p.amount || 0), 0);
    const mark = markFor(unitId, period);
    const dueDate = dueDateOf(c, period);
    const overdueDays = daysBetween(dueDate, asOf);
    const grace = STATE.settings.graceDays;

    const base = {
      unitId, period, contract: c, due, mark,
      payments: pays, paid: entered, overdueDays, dueDate: iso(dueDate),
    };

    // خارج أي عقد — علامة ✗ المؤكدة تتقدم على أي دفعة جزئية:
    // دَين مؤكد بقيمة مجهولة لا يُمحى بتحصيل لا يُعرف هل غطّاه
    if (!c) {
      if (mark && mark.mark === 'unpaid')
        return { ...base, status: 'late', confirmed: true, unknownAmount: true };
      if (pays.length || (mark && mark.mark === 'paid'))
        return { ...base, status: 'orphan_paid' };            // سداد بلا عقد مسجّل
      return { ...base, status: 'none' };
    }

    // داخل عقد
    if (pays.length) {
      const target = due ? due.amount : null;
      if (target != null && entered >= target - 1) {
        const lastDate = pays.map(p => p.date).filter(Boolean).sort().pop();
        const late = lastDate && daysBetween(dueDate, d(lastDate)) > grace;
        return { ...base, status: late ? 'paid_late' : 'paid', paidDate: lastDate || null };
      }
      if (entered > 0) return { ...base, status: 'partial', remaining: due ? due.amount - entered : null };
    }
    if (mark && mark.mark === 'paid' && !pays.length)
      return { ...base, status: 'paid_imported', paid: due ? due.amount : 0, assumed: true };
    if (mark && mark.mark === 'unpaid')
      return { ...base, status: 'late', confirmed: true, remaining: due ? due.amount - entered : null };

    // لا سجل إطلاقًا
    const covered = cov && (!cov.buildingId || (u && u.buildingId === cov.buildingId));
    if (covered && cmpPeriod(period, cov.from) < 0)
      return { ...base, status: 'history' };                  // قبل تغطية الكشف — غير متتبَّع
    if (covered && cmpPeriod(period, cov.to) <= 0)
      return { ...base, status: 'unknown' };                  // داخل التغطية بلا علامة — غير موثَّق
    if (cmpPeriod(period, periodOf(asOf)) > 0)
      return { ...base, status: 'upcoming' };
    if (overdueDays > grace)
      return { ...base, status: 'late', remaining: due ? due.amount - entered : null };
    if (cmpPeriod(period, periodOf(asOf)) === 0)
      return { ...base, status: 'due', remaining: due ? due.amount - entered : null };
    return { ...base, status: 'due', remaining: due ? due.amount - entered : null };
  }

  /* ---------- تجميعات BI (كلها تقبل uset: مجموعة وحدات مرشَّحة) ---------- */
  function allCellInfos(period, asOf, uset) {
    return unitsIn(uset).map(u => cellInfo(u.id, period, asOf));
  }

  /* المتأخرات المؤكدة + الأعمار، والمجهول منفصل — لا يُخلط تقدير بحقيقة */
  function arrears(asOf, uset) {
    asOf = asOf || today();
    const to = periodOf(asOf);
    const rows = [], unknowns = [], undocumented = [];
    for (const u of unitsIn(uset)) {
      const cs = unitContracts(u.id);
      let from = STATE.meta.importCoverage.from;
      if (u.buildingId !== STATE.meta.importCoverage.buildingId && cs.length)
        from = periodOf(d(cs[0].start));
      if (cmpPeriod(from, STATE.meta.importCoverage.from) < 0) from = STATE.meta.importCoverage.from;
      for (let p = from; cmpPeriod(p, to) <= 0; p = addMonths(p, 1)) {
        const ci = cellInfo(u.id, p, asOf);
        if (ci.status === 'late') {
          if (ci.unknownAmount || !ci.due) unknowns.push(ci);
          else rows.push({ ...ci, amount: Math.max(0, ci.due.amount - ci.paid) });
        } else if (ci.status === 'partial') {
          // الجزئي لا يدخل المتأخرات إلا بعد تجاوز السماح — كغير المدفوع تمامًا
          if (ci.overdueDays > STATE.settings.graceDays)
            rows.push({ ...ci, amount: Math.max(0, (ci.due ? ci.due.amount : 0) - ci.paid) });
        } else if (ci.status === 'unknown' && ci.due) {
          undocumented.push({ ...ci, amount: ci.due.amount });
        }
      }
    }
    const total = rows.reduce((s, r) => s + r.amount, 0);
    const buckets = { 'b30': 0, 'b60': 0, 'b90': 0, 'b90p': 0 };
    for (const r of rows) {
      const dd = r.overdueDays;
      if (dd <= 30) buckets.b30 += r.amount;
      else if (dd <= 60) buckets.b60 += r.amount;
      else if (dd <= 90) buckets.b90 += r.amount;
      else buckets.b90p += r.amount;
    }
    const undocumentedTotal = undocumented.reduce((s, r) => s + r.amount, 0);
    return { rows, total, buckets, unknowns, undocumented, undocumentedTotal };
  }

  /* مستحق/محصَّل لشهر — والسداد المستورد يُحسب على أنه كامل (افتراض مُعلَن) */
  function monthTotals(period, asOf, uset) {
    asOf = asOf || today();
    let due = 0, collected = 0, unknownDue = 0, unknownCount = 0, orphanPaid = 0,
        estimatedPart = false, latePaid = 0;
    for (const ci of allCellInfos(period, asOf, uset)) {
      if (ci.status === 'orphan_paid') { orphanPaid++; continue; }
      if (!ci.due) continue;
      if (ci.status === 'history' || ci.status === 'none') continue;
      if (ci.status === 'unknown') { unknownDue += ci.due.amount; unknownCount++; continue; }
      if (ci.status === 'upcoming') continue;
      due += ci.due.amount;
      if (ci.due.estimated) estimatedPart = true;
      // الدفعات المُدخلة تُحتسب بمبلغها الفعلي؛ المستورد من الكشف بقيمة الاستحقاق (افتراض مُعلَن)
      if (ci.status === 'paid_imported') collected += ci.due.amount;
      else if (ci.status === 'paid') collected += ci.paid;
      else if (ci.status === 'paid_late') { collected += ci.paid; latePaid += ci.paid; }
      else if (ci.status === 'partial') collected += ci.paid;
    }
    return {
      period, due, collected, unknownDue, unknownCount, orphanPaid, estimatedPart, latePaid,
      rate: due > 0 ? collected / due : null,
    };
  }

  function collectionSeries(endPeriod, n, asOf, uset) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) out.push(monthTotals(addMonths(endPeriod, -i), asOf, uset));
    return out;
  }

  /* الإشغال: مؤجَّرة / عقد منتهٍ بلا تجديد / بلا عقد مسجّل */
  function occupancy(asOf, uset) {
    asOf = asOf || today();
    const groups = { occupied: [], ended: [], noContract: [] };
    for (const u of unitsIn(uset)) {
      const cs = unitContracts(u.id);
      const act = activeContractOn(u.id, asOf);
      if (act) groups.occupied.push({ unit: u, contract: act });
      else if (cs.length) {
        const last = cs[cs.length - 1];
        groups.ended.push({ unit: u, contract: last, endedDays: daysBetween(d(last.end), asOf) });
      } else groups.noContract.push({ unit: u });
    }
    return { ...groups, total: unitsIn(uset).length };
  }

  /* تجديدات: عقود تنتهي خلال n يوم بلا عقد لاحق + المنتهية فعلًا بلا تجديد */
  function renewals(withinDays, asOf, uset) {
    asOf = asOf || today();
    const soon = [], overdue = [];
    for (const c of STATE.contracts) {
      if (uset && !uset.has(c.unitId)) continue;
      if (nextContract(c)) continue;
      const left = daysBetween(asOf, d(c.end));
      if (left < 0) {
        const stillLast = unitContracts(c.unitId).slice(-1)[0] === c;
        if (stillLast) overdue.push({ contract: c, daysAgo: -left });
      } else if (left <= withinDays) soon.push({ contract: c, daysLeft: left });
    }
    soon.sort((a, b) => a.daysLeft - b.daysLeft);
    overdue.sort((a, b) => b.daysAgo - a.daysAgo);
    return { soon, overdue };
  }

  function depositsHeld(uset) {
    return STATE.contracts
      .filter(c => (!uset || uset.has(c.unitId)) && c.deposit && c.deposit.status === 'held')
      .map(c => ({ contract: c, amount: c.deposit.amount }));
  }

  /* الإيراد المتعاقد عليه للأشهر القادمة */
  function contractedRevenue(fromPeriod, n, uset) {
    let total = 0, anyEstimated = false;
    const series = [];
    for (let i = 0; i < n; i++) {
      const p = addMonths(fromPeriod, i);
      let m = 0;
      for (const u of unitsIn(uset)) {
        // أول عقد مطابق فقط — اتساقًا مع cellInfo حتى لا يتضاعف شهر متداخل
        const c = contractsOverlappingMonth(u.id, p)[0];
        if (c) {
          const due = dueForMonth(c, p);
          if (due) { m += due.amount; if (due.estimated) anyEstimated = true; }
        }
      }
      series.push({ period: p, amount: Math.round(m) });
      total += m;
    }
    return { total: Math.round(total), series, anyEstimated };
  }

  /* توزيع استحقاق شهر على أنواع الوحدات */
  function revenueByType(period, uset) {
    const by = {};
    for (const u of unitsIn(uset)) {
      const c = contractsOverlappingMonth(u.id, period)[0];
      if (c) {
        const due = dueForMonth(c, period);
        if (due) by[u.type] = (by[u.type] || 0) + due.amount;
      }
    }
    return Object.entries(by).map(([type, v]) => ({ type, amount: Math.round(v) }))
      .sort((a, b) => b.amount - a.amount);
  }

  /* =====================================================
     تحليلات المدير: من فوق لتحت — المشروع أولًا ثم التفاصيل
     ===================================================== */

  /* وحدة «شغّالة» تجاريًا: عقد نشط، أو بتدفع فعليًا ولو بلا عقد مسجّل (كجراج الهدم) */
  function unitIsEarning(u, period, asOf) {
    if (activeContractOn(u.id, asOf)) return true;
    const ci = cellInfo(u.id, period, asOf);
    return ci.status === 'orphan_paid';
  }

  /* إحصاءات مشروع (كشف/مبنى) كاملة لشهر */
  function projectStats(bid, period, asOf) {
    asOf = asOf || today();
    const us = STATE.units.filter(u => u.buildingId === bid);
    const uset = new Set(us.map(u => u.id));
    const rented = us.filter(u => unitIsEarning(u, period, asOf));
    const mt = monthTotals(period, asOf, uset);
    const ar = arrears(asOf, uset);
    const ren = renewals(90, asOf, uset);
    const vac = vacancyInfo(asOf, uset);
    return {
      building: building(bid), uset,
      unitsTotal: us.length,
      rented: rented.length,
      vacant: us.length - rented.length,
      monthDue: mt.due + mt.unknownDue,
      monthCollected: mt.collected,
      rate: mt.rate,
      arrears: ar.total,
      unknownArrears: ar.unknowns.length,
      needsConfirm: ar.undocumentedTotal,
      expiringSoon: ren.soon.length + ren.overdue.length,
      overdueRenewals: ren.overdue.length,
      vacancyLossMonthly: vac.totalMonthly,
      deposits: depositsHeld(uset).reduce((s, x) => s + x.amount, 0),
    };
  }
  function allProjectsStats(period, asOf) {
    return STATE.buildings.map(b => projectStats(b.id, period, asOf));
  }

  /* الشواغر: من إمتى فاضية + الخسارة الشهرية التقديرية (آخر إيجار أو متوسط النوع) */
  function typeAvgRent(asOf) {
    const by = {};
    for (const u of STATE.units) {
      const c = activeContractOn(u.id, asOf);
      if (!c) continue;
      const y = c.years.find(yy => d(yy.from) <= asOf && asOf <= d(yy.to));
      if (!y) continue;
      (by[u.type] = by[u.type] || []).push(monthlyRate(y.rent));
    }
    const out = {};
    for (const t in by) out[t] = by[t].reduce((s, v) => s + v, 0) / by[t].length;
    return out;
  }
  function vacancyInfo(asOf, uset) {
    asOf = asOf || today();
    const period = periodOf(asOf);
    const avg = typeAvgRent(asOf);
    const rows = [];
    for (const u of unitsIn(uset)) {
      if (unitIsEarning(u, period, asOf)) continue;
      const cs = unitContracts(u.id);
      const last = cs.length ? cs[cs.length - 1] : null;
      let since = null, months = null, est = null, src = null;
      if (last) {
        since = last.end;
        months = Math.max(0, Math.round(daysBetween(d(last.end), asOf) / 30.44 * 10) / 10);
        const y = last.years[last.years.length - 1];
        est = Math.round(monthlyRate(y.rent));
        src = 'آخر إيجار للوحدة';
      } else if (avg[u.type]) {
        est = Math.round(avg[u.type]);
        src = 'متوسط النوع المماثل';
      }
      rows.push({
        unit: u, since, months, estMonthly: est, src,
        accumLoss: est != null && months != null ? Math.round(est * Math.min(months, 12)) : null,
      });
    }
    rows.sort((a, b) => (b.estMonthly || 0) - (a.estMonthly || 0));
    const withEst = rows.filter(r => r.estMonthly != null);
    return {
      rows,
      count: rows.length,
      totalMonthly: withEst.reduce((s, r) => s + r.estMonthly, 0),
      totalAccum: rows.filter(r => r.accumLoss != null).reduce((s, r) => s + r.accumLoss, 0),
      avgMonths: (function () {
        const m = rows.filter(r => r.months != null).map(r => r.months);
        return m.length ? Math.round(m.reduce((s, v) => s + v, 0) / m.length * 10) / 10 : null;
      })(),
    };
  }

  /* داخل / خارج: عقود بتبدأ وبتنتهي كل شهر قادم + أثرها على الدخل */
  function inOutForecast(fromPeriod, n, uset) {
    const out = [];
    let prevIncome = null;
    for (let i = 0; i < n; i++) {
      const p = addMonths(fromPeriod, i);
      const starts = [], ends = [];
      for (const c of STATE.contracts) {
        if (uset && !uset.has(c.unitId)) continue;
        if (periodOf(d(c.start)) === p) starts.push(c);
        if (periodOf(d(c.end)) === p && !nextContract(c)) ends.push(c);
      }
      const income = contractedRevenue(p, 1, uset).total;
      const deltaPct = prevIncome != null && prevIncome > 0
        ? Math.round((income - prevIncome) / prevIncome * 100) : null;
      out.push({ period: p, starts, ends, income, deltaPct });
      prevIncome = income;
    }
    return out;
  }

  /* الألارم: شهران متتاليان أو أكثر غير مسدَّدين حتى الشهر السابق */
  function consecutiveLateAlarms(asOf, uset) {
    asOf = asOf || today();
    const lastFull = addMonths(periodOf(asOf), -1);
    const from = STATE.meta.importCoverage.from;
    const alarms = [];
    for (const u of unitsIn(uset)) {
      let streak = 0, amount = 0, unknownAmt = false, periods = [];
      for (let p = from; cmpPeriod(p, lastFull) <= 0; p = addMonths(p, 1)) {
        const ci = cellInfo(u.id, p, asOf);
        if (ci.status === 'late' || ci.status === 'partial') {
          streak++;
          periods.push(p);
          if (ci.unknownAmount || !ci.due) unknownAmt = true;
          else amount += Math.max(0, ci.due.amount - ci.paid);
        } else if (ci.status === 'unknown' || ci.status === 'history') {
          // لا يقطع السلسلة ولا يزيدها — معلومة ناقصة
        } else {
          streak = 0; amount = 0; unknownAmt = false; periods = [];
        }
      }
      if (streak >= 2) {
        const cs = unitContracts(u.id);
        const tid = cs.length ? cs[cs.length - 1].tenantId : null;
        alarms.push({
          unit: u, building: building(u.buildingId),
          tenant: tid ? tenant(tid) : null,
          months: streak, periods, amount, unknownAmt,
        });
      }
    }
    alarms.sort((a, b) => b.months - a.months || b.amount - a.amount);
    return alarms;
  }

  /* التزام المستأجرين من الدفعات الموثَّقة: نقاط = نسبة السداد في الميعاد */
  function complianceBuckets(uset) {
    const grace = STATE.settings.graceDays;
    const perTenant = [];
    for (const t of STATE.tenants) {
      const pays = STATE.payments.filter(p => {
        if (!p.date || (uset && !uset.has(p.unitId))) return false;
        const c = contract(p.contractId);
        return c && c.tenantId === t.id;
      });
      if (pays.length < 3) continue;
      let onTime = 0;
      for (const p of pays) {
        const c = contract(p.contractId);
        if (daysBetween(dueDateOf(c, p.period), d(p.date)) <= grace) onTime++;
      }
      perTenant.push({ tenant: t, n: pays.length, onTime, lateN: pays.length - onTime, points: Math.round(onTime / pays.length * 100) });
    }
    perTenant.sort((a, b) => b.points - a.points);
    return {
      perTenant,
      punctual: perTenant.filter(x => x.points >= 90).length,
      sometimesLate: perTenant.filter(x => x.points >= 60 && x.points < 90).length,
      delinquent: perTenant.filter(x => x.points < 60).length,
    };
  }

  /* صحة المحفظة 0–100: تحصيل + إشغال − فجوات − تركّز انتهاءات − تعمّر متأخرات */
  function healthScore(asOf, uset) {
    asOf = asOf || today();
    const m = addMonths(periodOf(asOf), -1);
    const mt = monthTotals(m, asOf, uset);
    const occ = occupancy(asOf, uset);
    const ar = arrears(asOf, uset);
    const ren = renewals(90, asOf, uset);
    const income12 = contractedRevenue(periodOf(asOf), 12, uset).total || 1;
    const collectScore = (mt.rate == null ? 0.5 : mt.rate) * 40;
    const occScore = (occ.total ? occ.occupied.length / occ.total : 0) * 25;
    const unknownPenalty = Math.min(15, ((mt.unknownDue + ar.undocumentedTotal) / Math.max(1, mt.due + mt.unknownDue)) * 15);
    const agingPenalty = Math.min(10, (ar.buckets.b90p / Math.max(1, ar.total || 1)) * 10);
    const expiringShare = ren.overdue.length * 2 + ren.soon.length;
    const expiringPenalty = Math.min(10, expiringShare * 2.5);
    const score = Math.round(Math.max(0, Math.min(100,
      collectScore + occScore + (15 - unknownPenalty) + (10 - agingPenalty) + (10 - expiringPenalty))));
    return { score, parts: { collectScore: Math.round(collectScore), occScore: Math.round(occScore), unknownPenalty: Math.round(unknownPenalty), agingPenalty: Math.round(agingPenalty), expiringPenalty: Math.round(expiringPenalty) }, income12 };
  }

  /* تركّز المخاطر: أكبر مستأجر كنسبة من دخل الشهر */
  function topTenantShare(period, uset) {
    const by = {};
    for (const u of unitsIn(uset)) {
      const c = contractsOverlappingMonth(u.id, period)[0];
      if (!c) continue;
      const due = dueForMonth(c, period);
      if (due) by[c.tenantId] = (by[c.tenantId] || 0) + due.amount;
    }
    const total = Object.values(by).reduce((s, v) => s + v, 0);
    const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
    if (!top || !total) return null;
    return { tenant: tenant(top[0]), amount: Math.round(top[1]), share: Math.round(top[1] / total * 100) };
  }

  /* الدخل السنوي المتوقع لكل مشروع (التأمينات التزام منفصل — ليست دخلًا) */
  function annualByProject(fromPeriod) {
    return STATE.buildings.map(b => {
      const uset = new Set(STATE.units.filter(u => u.buildingId === b.id).map(u => u.id));
      return {
        building: b,
        annual: contractedRevenue(fromPeriod, 12, uset).total,
        deposits: depositsHeld(uset).reduce((s, x) => s + x.amount, 0),
      };
    }).sort((a, b) => b.annual - a.annual);
  }

  /* ---------- عمليات الإدخال ---------- */
  let idSeq = 1000;
  function genId(prefix) { return prefix + (idSeq++) + '-' + Math.random().toString(36).slice(2, 6); }

  function addPayment(rec) {
    const c = contractsOverlappingMonth(rec.unitId, rec.period)[0] || null;
    STATE.payments.push({
      id: genId('P'), contractId: c ? c.id : null, source: 'entered',
      unitId: rec.unitId, period: rec.period,
      amount: Number(rec.amount) || 0,
      date: rec.date || null, method: rec.method || 'نقدًا',
      receiptNo: rec.receiptNo || '', notes: rec.notes || '',
    });
    logAct(`دفعة ${Math.round(rec.amount).toLocaleString('en-US')} ج.م — ${unit(rec.unitId) ? unit(rec.unitId).name : ''} (${periodLabel(rec.period, true)})`);
    commit();
  }
  /* سداد جماعي: N دفعات في عملية واحدة (لما تكون مأجّر 1000 وحدة) */
  function addPaymentsBulk(recs) {
    for (const rec of recs) {
      const c = contractsOverlappingMonth(rec.unitId, rec.period)[0] || null;
      STATE.payments.push({
        id: genId('P'), contractId: c ? c.id : null, source: 'entered',
        unitId: rec.unitId, period: rec.period,
        amount: Number(rec.amount) || 0,
        date: rec.date || null, method: rec.method || 'نقدًا',
        receiptNo: rec.receiptNo || '', notes: rec.notes || '',
      });
    }
    logAct(`سداد جماعي: ${recs.length} دفعة (${periodLabel(recs[0] ? recs[0].period : '', true)})`);
    commit();
  }

  function deletePayment(id) {
    const p = STATE.payments.find(x => x.id === id);
    STATE.payments = STATE.payments.filter(x => x.id !== id);
    if (p) logAct(`حذف دفعة — ${unit(p.unitId) ? unit(p.unitId).name : ''} (${periodLabel(p.period, true)})`);
    commit();
  }

  /* علامة تفريغ (وضع تفريغ كشف): ✓ / ✗ / مسح */
  function setMark(unitId, period, mark) {
    STATE.marks = STATE.marks.filter(m => !(m.unitId === unitId && m.period === period));
    if (mark) STATE.marks.push({ unitId, period, mark });
    commit();
  }

  function addContract(rec) {
    const years = [];
    let from = rec.start;
    for (let i = 0; i < rec.years.length; i++) {
      const [y, m, dd] = from.split('-').map(Number);
      const toDate = new Date(Date.UTC(y + 1, m - 1, dd));
      toDate.setUTCDate(toDate.getUTCDate() - 1);
      years.push({ from, to: iso(toDate), rent: rec.years[i].rent, estimated: !!rec.years[i].estimated });
      const nf = new Date(Date.UTC(y + 1, m - 1, dd));
      from = iso(nf);
    }
    const c = {
      id: genId('C'), unitId: rec.unitId, tenantId: rec.tenantId,
      start: rec.start, end: years[years.length - 1].to,
      years, prevId: rec.prevId || null,
      dueDay: Math.min(28, Math.max(1, Number(rec.dueDay) || 1)),
      maintenance: Math.max(0, Number(rec.maintenance) || 0),
      vat: !!rec.vat,
      deposit: rec.deposit ? { amount: Number(rec.deposit), status: 'held', note: '' } : null,
      source: 'entered',
    };
    STATE.contracts.push(c);
    logAct(`عقد جديد — ${unit(rec.unitId) ? unit(rec.unitId).name : ''} / ${tenant(rec.tenantId) ? tenant(rec.tenantId).name : ''}`);
    commit();
    return c;
  }

  function addTenant(rec) {
    const t = { id: genId('T'), name: rec.name, kind: rec.kind || 'فرد', phone: rec.phone || '', note: rec.note || '' };
    STATE.tenants.push(t); commit(); return t;
  }
  function updateTenant(id, patch) {
    const t = tenant(id); if (t) { Object.assign(t, patch); commit(); }
  }
  function addUnit(rec) {
    const u = { id: genId('U'), buildingId: rec.buildingId, name: rec.name, type: rec.type || 'غير محدد', floor: rec.floor || '', note: rec.note || '' };
    STATE.units.push(u);
    logAct(`وحدة جديدة — ${rec.name}`);
    commit(); return u;
  }
  function addBuilding(rec) {
    const b = { id: genId('B'), name: rec.name, owner: rec.owner || '', area: rec.area || '', note: rec.note || '', demo: false };
    STATE.buildings.push(b);
    logAct(`كشف/مبنى جديد — ${rec.name}`);
    commit(); return b;
  }
  /* حذف البيانات التوضيحية عند بدء الاستخدام الفعلي */
  function removeDemoData() {
    const demoB = new Set(STATE.buildings.filter(b => b.demo).map(b => b.id));
    const demoU = new Set(STATE.units.filter(u => demoB.has(u.buildingId)).map(u => u.id));
    const demoT = new Set(STATE.contracts.filter(c => demoU.has(c.unitId)).map(c => c.tenantId));
    STATE.buildings = STATE.buildings.filter(b => !demoB.has(b.id));
    STATE.units = STATE.units.filter(u => !demoU.has(u.id));
    STATE.contracts = STATE.contracts.filter(c => !demoU.has(c.unitId));
    STATE.payments = STATE.payments.filter(p => !demoU.has(p.unitId));
    STATE.marks = STATE.marks.filter(m => !demoU.has(m.unitId));
    STATE.complaints = STATE.complaints.filter(k => !demoU.has(k.unitId));
    // مستأجرو المباني التوضيحية فقط (غير المرتبطين بعقود باقية)
    STATE.tenants = STATE.tenants.filter(t =>
      !demoT.has(t.id) || STATE.contracts.some(c => c.tenantId === t.id));
    logAct('حذف البيانات التوضيحية');
    commit();
  }

  function addComplaint(rec) {
    STATE.complaints.push({
      id: genId('K'), unitId: rec.unitId || null, tenantId: rec.tenantId || null,
      openedAt: rec.openedAt || iso(today()), category: rec.category, desc: rec.desc || '',
      status: 'open', cost: Number(rec.cost) || 0, borneBy: rec.borneBy || 'المالك',
      closedAt: null,
    });
    logAct(`شكوى — ${unit(rec.unitId) ? unit(rec.unitId).name : ''} (${rec.category})`);
    commit();
  }
  function closeComplaint(id, closedAt) {
    const k = STATE.complaints.find(x => x.id === id);
    if (k) { k.status = 'closed'; k.closedAt = closedAt; logAct('إغلاق شكوى'); commit(); }
  }

  function setIssueStatus(id, status, resolution) {
    const q = STATE.issues.find(x => x.id === id);
    if (q) {
      q.status = status;
      if (resolution != null) q.resolution = resolution;
      logAct((status === 'resolved' ? 'حسم ملاحظة: ' : 'إعادة فتح ملاحظة: ') + q.title.slice(0, 40));
      commit();
    }
  }
  function updateSettings(patch) { Object.assign(STATE.settings, patch); commit(); }

  /* ---------- تصدير CSV (بترويسة UTF-8 BOM ليفتح سليمًا في Excel) ---------- */
  function toCSV(rows) {
    return '﻿' + rows.map(r => r.map(v => {
      v = v == null ? '' : String(v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(',')).join('\r\n');
  }
  function download(filename, text) {
    const blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  /* ---------- الواجهة العامة ---------- */
  window.Store = {
    load, save, commit, subscribe, resetData,
    get state() { return STATE; },
    // تاريخ
    d, iso, today, periodOf, addMonths, cmpPeriod, monthFirst, monthLast,
    daysBetween, periodLabel, MONTHS_AR,
    // كيانات
    building, unit, tenant, contract, unitContracts, nextContract, activeContractOn,
    contractsOverlappingMonth,
    // محرك
    dueForMonth, dueDateOf, cellInfo, allCellInfos, paymentsFor, markFor,
    // BI
    arrears, monthTotals, collectionSeries, occupancy, renewals,
    depositsHeld, contractedRevenue, revenueByType,
    projectStats, allProjectsStats, vacancyInfo, inOutForecast,
    consecutiveLateAlarms, complianceBuckets, healthScore,
    topTenantShare, annualByProject, unitIsEarning,
    // إدخال
    addPayment, addPaymentsBulk, deletePayment, setMark, addContract, addTenant, updateTenant,
    addUnit, addBuilding, removeDemoData, addComplaint, closeComplaint,
    setIssueStatus, updateSettings,
    // تصدير
    toCSV, download,
  };
})();

</script>
  <script>
/* =========================================================
   i18n-content.js — المحتوى الموسّع للنسخة الإنجليزية
   يُدمج آليًا في i18n.js: I18N_EXTRA (قاموس) + I18N_PATTERNS (أنماط)
   + I18N_TOKENS (أسماء ورموز). لا يعدّل أي ملف آخر.
   ========================================================= */
(function () {
  'use strict';

  var MONTH = {
    'يناير': 'Jan', 'فبراير': 'Feb', 'مارس': 'Mar', 'أبريل': 'Apr',
    'مايو': 'May', 'يونيو': 'Jun', 'يوليو': 'Jul', 'أغسطس': 'Aug',
    'سبتمبر': 'Sep', 'أكتوبر': 'Oct', 'نوفمبر': 'Nov', 'ديسمبر': 'Dec',
  };
  var MONTH_RE = 'يناير|فبراير|مارس|أبريل|مايو|يونيو|يوليو|أغسطس|سبتمبر|أكتوبر|نوفمبر|ديسمبر';

  /* خريطة الأسماء: مباني/ملاك/مناطق/مستأجرين/وحدات/أدوار — تُرتَّب الأطول أولًا */
  var NAMES = [
    // كشوف وملاك ومناطق
    ['بيان عبدالمنعم سكرية', 'Abdelmoneim Sokareya Statement'],
    ['عبدالمنعم سكرية', 'Abdelmoneim Sokareya'],
    ['تقوى عبدالمنعم', 'Taqwa Abdelmoneim'],
    ['سكرية', 'Sokareya'],
    ['برج النيل الإداري', 'Nile Administrative Tower'],
    ['ورثة محمود النقيب', 'Heirs of Mahmoud El-Nakib'],
    ['مركز الحرية التجاري', 'Al-Horreya Commercial Center'],
    ['شركة الحرية للاستثمار', 'Al-Horreya Investment Co.'],
    ['الدقي — الجيزة', 'Dokki — Giza'],
    ['المهندسين — الجيزة', 'Mohandessin — Giza'],
    ['الهرم — الجيزة', 'Haram — Giza'],
    // مستأجرو الكشف الفعلي
    ['علاء الدين محمد حافظ', 'Alaa El-Din Mohamed Hafez'],
    ['صالون علاء', 'Alaa Salon'],
    ['حسام سنوسي', 'Hossam Senoussi'],
    ['معمل تحاليل الدقة الطبية', 'El-Dekka Medical Labs'],
    ['الدقة', 'El-Dekka'],
    ['العنوان', 'El-Enwan'],
    ['عز الدين', 'Ezz El-Din'],
    ['مصطفى عثمان', 'Mostafa Osman'],

    'بيان ورقي من مالك عقار (زي «بيان عبدالمنعم سكرية») + نموذج عقد. الورقة = كشف مستقل في المنظومة.':
      'A paper statement from a property owner (like the “Abdelmoneim Sokareya Statement”) + a contract form. Each paper = an independent statement in the suite.',
    'شاشة «إدخال كشف جديد»: بيانات المالك ← صفوف الورقة بنفس أعمدتها (اسم العميل/الوحدة/من/قيم 1-2-3/ملاحظات) ← علامات ✓/✗ من جدول التحصيل بوضع نقل الورقة. الخانة الفارغة تُسجَّل «يحتاج تأكيد» — الفراغ معلومة.':
      'The “New Statement Intake” screen: owner details → the paper’s rows with its exact columns (client name / unit / from / values 1-2-3 / notes) → ✓/✗ marks from the collection sheet in Transcribe mode. Empty cells register as “Needs confirmation” — a blank is information.',
    'كل تناقض أو نقص يتسجّل تلقائيًا في «جودة البيانات» بنص المصدر الحرفي. تقعد مع المالك جلسة واحدة تقفل الأسئلة (تليفونات، تأمينات، قيم ناقصة، فراغات = سداد ولا تأخير؟).':
      'Every contradiction or gap is logged automatically in “Data Quality” with the source’s verbatim text. One sitting with the owner closes the questions (phones, deposits, missing values, blanks = paid or late?).',
    'التحصيل الجديد يتسجّل دفعة كاملة (مبلغ+تاريخ+طريقة+إيصال) من خلية جدول التحصيل أو بالسداد الجماعي. عقد جديد/تجديد من زر «+ إدخال». شكوى تتسجّل بتصنيفها وتكلفتها.':
      'New collections are logged as full payments (amount + date + method + receipt) from a collection sheet cell or via bulk collection. A new contract/renewal via the “+ Add” button. Complaints are logged with category and cost.',
    'مش بتراجع 1000 وحدة — بتفتح «من لم يسدِّد؟» والتنبيهات والتحليلات: بيوروك بس اللي محتاج قرار (متأخر، عقد بينتهي، فجوة توثيق).':
      'You don’t review 1,000 units — you open “Who has not paid?”, the alerts, and Insights: they show only what needs a decision (a late payer, an expiring contract, a documentation gap).',
    'تصدير CSV للمالك (متأخرات/جدول التحصيل/عقود/دفعات) + التحليلات للقرارات: مين نطارده، إمتى نجدد، فين الفاقد.':
      'CSV exports for the owner (arrears / collection sheet / contracts / payments) + Insights for decisions: whom to chase, when to renew, where the loss is.',
