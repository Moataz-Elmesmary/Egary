<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إيجاري — تسجيل الدخول</title>
<style>
/* =========================================================
   صفحة الدخول — هوية إيجاري (بنفسجي) بديناميكيات تفاعلية كاملة
   المستخدمون وكلمات المرور: في أول <script> تحت — عدّلهم من هناك
   ========================================================= */
:root{
  --bg:#0b0716; --fg:#eae6f7;
  --eg:#a78bfa; --eg-deep:#4c1d95; --eg-mid:#6d28d9; --cy:#9085e9;
  --gold:#fab219;
  --white-icon:#f3f3f398;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Segoe UI Arabic",Tahoma,system-ui,sans-serif;
  background:var(--bg);color:var(--fg);min-height:100vh;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;}

/* نص متلألئ */
.shiny{
  background:linear-gradient(135deg,var(--eg) 25%,var(--cy) 50%,var(--eg-deep) 75%,var(--eg) 100%) 0% 0% / 400% 100% text;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:shine 3s linear infinite;}
@keyframes shine{0%{background-position:100% 50%}30%,70%{background-position:0% 50%}100%{background-position:-100% 50%}}

#web-canvas{position:fixed;inset:0;z-index:0;}

/* الكرة السلكية الدوّارة */
.globe-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none;}
.globe{width:min(700px,150vmin);height:min(700px,150vmin);border-radius:50%;position:relative;
  background:radial-gradient(circle at 35% 35%,rgba(167,139,250,.26),rgba(144,133,233,.15) 35%,rgba(76,29,149,.38) 60%,rgba(11,7,22,.65));
  border:1px solid rgba(167,139,250,.22);
  box-shadow:0 0 140px rgba(167,139,250,.18),0 0 240px rgba(144,133,233,.1),inset 0 0 120px rgba(76,29,149,.25);
  animation:globeSpin 28s linear infinite}
@keyframes globeSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.globe::before{content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(167,139,250,.07);animation:globeSpin 20s linear infinite reverse}
.globe::after{content:'';position:absolute;inset:30px;border-radius:50%;
  border:1px dashed rgba(167,139,250,.05);animation:globeSpin 35s linear infinite}
.lon{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(167,139,250,.055)}
.lon1{transform:rotateY(30deg)}.lon2{transform:rotateY(60deg)}.lon3{transform:rotateY(90deg)}
.lon4{transform:rotateY(120deg)}.lon5{transform:rotateY(150deg)}.lon6{transform:rotateY(15deg)}
.dot{position:absolute;border-radius:50%;background:var(--eg);animation:dotPulse 3s ease infinite}
.dot1{width:7px;height:7px;top:26%;right:40%}
.dot2{width:5px;height:5px;top:52%;right:66%;animation-delay:.7s}
.dot3{width:6px;height:6px;top:72%;right:28%;animation-delay:1.5s}
.dot4{width:4px;height:4px;top:38%;right:72%;animation-delay:2.1s}
.dot5{width:5px;height:5px;top:18%;right:58%;animation-delay:2.7s}
.dot6{width:3px;height:3px;top:65%;right:52%;animation-delay:1.1s}
@keyframes dotPulse{0%,100%{opacity:.3;transform:scale(1)}
  50%{opacity:1;transform:scale(2);box-shadow:0 0 10px rgba(167,139,250,.7)}}

.overlay{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(11,7,22,.4) 90%)}

/* الكارد */
.card-wrap{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;
  width:100%;height:100vh;pointer-events:none;}
.card{pointer-events:all;width:min(400px,92vw);
  background:rgba(16,10,31,.88);border:1px solid rgba(167,139,250,.18);border-radius:26px;
  padding:44px 40px;backdrop-filter:blur(24px);
  box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px rgba(167,139,250,.06),inset 0 1px 0 rgba(167,139,250,.08);
  animation:cardIn .8s cubic-bezier(.22,1,.36,1) both;transform-style:preserve-3d;}
@keyframes cardIn{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.logo-wrap{text-align:center;margin-bottom:32px}
.logo-ring{width:84px;height:84px;border-radius:22px;margin:0 auto 16px;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#a78bfa 0%,#7c3aed 45%,#4c1d95 100%);
  border:1px solid rgba(167,139,250,.25);
  animation:logoFloat 5s ease-in-out infinite;}
.logo-ring::before{content:'';position:absolute;inset:-8px;border-radius:30px;
  background:radial-gradient(circle at 50% 50%,rgba(250,178,25,.14),rgba(167,139,250,.12) 50%,transparent 75%);
  filter:blur(10px);animation:glowPulse 4.5s ease-in-out infinite;z-index:0;}
@keyframes glowPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.05)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.logo-ring svg{width:44px;height:44px;position:relative;z-index:2;
  filter:drop-shadow(0 0 14px rgba(167,139,250,.6));}
.logo-title{font-size:26px;font-weight:800;margin-bottom:4px;letter-spacing:.01em}
.logo-sub{font-size:11px;font-weight:500;color:var(--white-icon);letter-spacing:.06em}

.field{margin-bottom:18px;position:relative}
.field label{display:block;font-size:11px;font-weight:700;color:rgba(167,139,250,.75);
  letter-spacing:.06em;margin-bottom:8px}
.field input{width:100%;height:48px;padding:0 18px;border-radius:13px;
  border:1px solid rgba(167,139,250,.16);background:rgba(11,7,22,.7);color:var(--fg);
  font:14px "Segoe UI","Segoe UI Arabic",Tahoma,sans-serif;outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s}
.field input:focus{border-color:var(--eg);background:rgba(11,7,22,.9);
  box-shadow:0 0 0 3px rgba(167,139,250,.14)}
.field input::placeholder{color:rgba(167,139,250,.32)}

.err-box{background:rgba(204,73,72,.1);border:1px solid rgba(204,73,72,.25);
  border-radius:10px;padding:10px 14px;font-size:13px;color:#f09090;
  margin-bottom:18px;text-align:center;display:none;
  animation:errShake .42s cubic-bezier(.36,.07,.19,.97) both}
.err-box.show{display:block}
@keyframes errShake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}

.caps-warn{position:absolute;inset-inline-end:48px;top:38px;
  background:rgba(255,180,0,.12);border:1px solid rgba(255,180,0,.3);color:#ffc845;
  padding:4px 8px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.04em;
  display:none;animation:fadeIn .2s ease;pointer-events:none;}
.caps-warn.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}

.pw-toggle{position:absolute;inset-inline-end:14px;top:34px;width:28px;height:28px;border:none;
  background:transparent;color:var(--white-icon);cursor:pointer;border-radius:6px;
  display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s;padding:0;}
.pw-toggle:hover{color:var(--gold);background:rgba(250,178,25,.08)}

.sign-btn{width:100%;height:50px;border-radius:14px;border:none;margin-top:8px;
  background:linear-gradient(135deg,#4c1d95,#6d28d9 50%,#4c1d95);background-size:200% 100%;
  color:#fff;font:600 15px "Segoe UI","Segoe UI Arabic",Tahoma,sans-serif;cursor:pointer;letter-spacing:.02em;
  transition:background-position .4s,box-shadow .25s,transform .15s,opacity .2s;
  box-shadow:0 4px 24px rgba(76,29,149,.55);position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:10px}
.sign-btn:hover:not(:disabled){background-position:100% 0;box-shadow:0 8px 40px rgba(109,40,217,.7);transform:translateY(-2px)}
.sign-btn:active:not(:disabled){transform:translateY(0) scale(.99)}
.sign-btn:disabled{cursor:wait;opacity:.7}
.btn-spinner{display:none;width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.sign-btn.loading .btn-spinner{display:inline-block}
.sign-btn.loading .btn-label{opacity:.85}

.hint-line{margin-top:16px;text-align:center;font-size:11px;color:rgba(234,230,247,.4)}

/* توهج الماوس */
.cursor-glow{position:fixed;top:0;left:0;width:400px;height:400px;border-radius:50%;
  pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(167,139,250,.32) 0%,rgba(144,133,233,.16) 35%,transparent 70%);
  transform:translate3d(-200px,-200px,0);mix-blend-mode:screen;filter:blur(20px);
  transition:transform .08s linear,opacity .3s;opacity:0;}
.cursor-glow.visible{opacity:1}
@media (prefers-reduced-motion: reduce){.cursor-glow{display:none}}

/* الفراشات */
.butterfly-layer{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
.butterfly{position:absolute;width:32px;height:32px;opacity:.16;will-change:transform;
  filter:drop-shadow(0 0 4px rgba(167,139,250,.35));}
.butterfly .wing{transform-origin:50% 50%;animation:flap .4s ease-in-out infinite;}
.butterfly .wing.r{animation-name:flapR;}
@keyframes flap{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.35)}}
@keyframes flapR{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-.35)}}
.butterfly.b1{top:18%;animation:driftRight 38s linear infinite;animation-delay:-3s;}
.butterfly.b2{top:65%;animation:driftLeft 46s linear infinite;animation-delay:-12s;}
.butterfly.b3{top:35%;animation:driftRight 52s linear infinite;animation-delay:-25s;opacity:.11;}
.butterfly.b4{top:80%;animation:driftRight 41s linear infinite;animation-delay:-7s;opacity:.13;}
.butterfly.b5{top:8%;animation:driftLeft 56s linear infinite;animation-delay:-18s;opacity:.1;}
@keyframes driftRight{
  0%{transform:translate3d(-50px,0,0) rotate(8deg)}
  25%{transform:translate3d(25vw,-30px,0) rotate(-4deg)}
  50%{transform:translate3d(50vw,15px,0) rotate(6deg)}
  75%{transform:translate3d(75vw,-20px,0) rotate(-3deg)}
  100%{transform:translate3d(calc(100vw + 50px),0,0) rotate(8deg)}}
@keyframes driftLeft{
  0%{transform:translate3d(calc(100vw + 50px),0,0) rotate(-8deg) scaleX(-1)}
  25%{transform:translate3d(75vw,20px,0) rotate(4deg) scaleX(-1)}
  50%{transform:translate3d(50vw,-15px,0) rotate(-6deg) scaleX(-1)}
  75%{transform:translate3d(25vw,30px,0) rotate(3deg) scaleX(-1)}
  100%{transform:translate3d(-50px,0,0) rotate(-8deg) scaleX(-1)}}
@media (prefers-reduced-motion: reduce){.butterfly-layer{display:none}.card{animation:none}}
</style>
</head>
<body>

<canvas id="web-canvas"></canvas>
<div class="cursor-glow" id="cursorGlow"></div>

<div class="butterfly-layer" aria-hidden="true">
  <svg class="butterfly b1" viewBox="0 0 32 32"><path class="wing l" fill="#a78bfa" d="M16 16 C 10 6, 2 6, 2 14 S 10 22, 16 16 Z"/><path class="wing r" fill="#fab219" d="M16 16 C 22 6, 30 6, 30 14 S 22 22, 16 16 Z"/><ellipse cx="16" cy="16" rx="1.4" ry="6" fill="#2c2440"/></svg>
  <svg class="butterfly b2" viewBox="0 0 32 32"><path class="wing l" fill="#fab219" d="M16 16 C 10 6, 2 6, 2 14 S 10 22, 16 16 Z"/><path class="wing r" fill="#a78bfa" d="M16 16 C 22 6, 30 6, 30 14 S 22 22, 16 16 Z"/><ellipse cx="16" cy="16" rx="1.4" ry="6" fill="#2c2440"/></svg>
  <svg class="butterfly b3" viewBox="0 0 32 32"><path class="wing l" fill="#a78bfa" d="M16 16 C 10 6, 2 6, 2 14 S 10 22, 16 16 Z"/><path class="wing r" fill="#9085e9" d="M16 16 C 22 6, 30 6, 30 14 S 22 22, 16 16 Z"/><ellipse cx="16" cy="16" rx="1.4" ry="6" fill="#2c2440"/></svg>
  <svg class="butterfly b4" viewBox="0 0 32 32"><path class="wing l" fill="#9085e9" d="M16 16 C 10 6, 2 6, 2 14 S 10 22, 16 16 Z"/><path class="wing r" fill="#a78bfa" d="M16 16 C 22 6, 30 6, 30 14 S 22 22, 16 16 Z"/><ellipse cx="16" cy="16" rx="1.4" ry="6" fill="#2c2440"/></svg>
  <svg class="butterfly b5" viewBox="0 0 32 32"><path class="wing l" fill="#a78bfa" d="M16 16 C 10 6, 2 6, 2 14 S 10 22, 16 16 Z"/><path class="wing r" fill="#fab219" d="M16 16 C 22 6, 30 6, 30 14 S 22 22, 16 16 Z"/><ellipse cx="16" cy="16" rx="1.4" ry="6" fill="#2c2440"/></svg>
</div>

<div class="globe-wrap">
  <div class="globe">
    <div class="lon lon1"></div><div class="lon lon2"></div><div class="lon lon3"></div>
    <div class="lon lon4"></div><div class="lon lon5"></div><div class="lon lon6"></div>
    <div class="dot dot1"></div><div class="dot dot2"></div><div class="dot dot3"></div>
    <div class="dot dot4"></div><div class="dot dot5"></div><div class="dot dot6"></div>
  </div>
</div>
<div class="overlay"></div>

<div class="card-wrap">
  <div class="card" id="loginCard">
    <div class="logo-wrap">
      <div class="logo-ring">
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 20.5v-4.2M9.5 20.5v-7M14.5 20.5v-9.8" stroke="rgba(255,255,255,0.55)" stroke-width="2.6"/>
          <path d="M4 13.5l5 5L20.5 6.5" stroke="#fff" stroke-width="2.6"/>
          <path d="M15.8 6.5h4.7v4.7" stroke="#fff" stroke-width="2.2"/>
        </svg>
      </div>
      <div class="logo-title shiny">إيجاري</div>
      <div class="logo-sub">نظام إدارة الإيجارات — Egary</div>
    </div>
    <div class="err-box" id="errBox">اسم المستخدم أو كلمة المرور غير صحيحة</div>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="userIn">اسم المستخدم</label>
        <input type="text" id="userIn" name="username" placeholder="اكتب اسم المستخدم" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="pwInput">كلمة المرور</label>
        <input type="password" id="pwInput" name="password" placeholder="اكتب كلمة المرور" required autocomplete="current-password">
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="إظهار كلمة المرور">
          <svg id="pwEyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg id="pwEyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
        <span class="caps-warn" id="capsWarn">⚠️ حروف كبيرة مفعّلة</span>
      </div>
      <button class="sign-btn" type="submit" id="signBtn">
        <span class="btn-spinner"></span>
        <span class="btn-label">دخول</span>
      </button>
    </form>
    <div class="hint-line">الدخول لتنظيم الاستخدام داخل المكتب — البيانات محفوظة على هذا الجهاز</div>
  </div>
</div>

<script>
/* =========================================================
   المستخدمون — عدّل الأسماء وكلمات المرور من هنا مباشرة
   role: admin = كل الشاشات · staff = بلا «الإعدادات» · viewer = مشاهدة (بلا إدخال ولا إعدادات)
   ========================================================= */
var USERS = {
  'moataz': { pass: 'egary@2026',  name: 'معتز',        role: 'admin',  roleLabel: 'مدير' },
  'office': { pass: 'office@2026', name: 'موظف المكتب', role: 'staff',  roleLabel: 'موظف' },
  'zaer':   { pass: '1234',        name: 'زائر',        role: 'viewer', roleLabel: 'مشاهدة فقط' },
};

/* لو داخل بالفعل — على طول للنظام */
try { if (sessionStorage.getItem('egary-user')) location.replace('index.html'); } catch (e) {}

/* توهج الماوس */
(function () {
  var glow = document.getElementById('cursorGlow'), raf = null;
  document.addEventListener('mousemove', function (e) {
    glow.classList.add('visible');
    if (raf) return;
    raf = requestAnimationFrame(function () {
      glow.style.transform = 'translate3d(' + (e.clientX - 200) + 'px,' + (e.clientY - 200) + 'px,0)';
      raf = null;
    });
  });
  window.addEventListener('mouseleave', function () { glow.classList.remove('visible'); });
})();

/* الشبكة العنكبوتية التفاعلية */
(function () {
  var cv = document.getElementById('web-canvas'), cx = cv.getContext('2d');
  var N = 55, D = 150, nodes = [], mouse = { x: -9999, y: -9999 };
  function resize() { cv.width = innerWidth; cv.height = innerHeight; }
  resize(); window.addEventListener('resize', resize);
  for (var i = 0; i < N; i++) nodes.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    vx: (Math.random() - .5) * .55, vy: (Math.random() - .5) * .55,
    r: 1 + Math.random() * 2.2,
  });
  document.addEventListener('mousemove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', function () { mouse.x = -9999; mouse.y = -9999; });
  function draw() {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (var i = 0; i < N; i++) {
      var n = nodes[i];
      n.x += n.vx; n.y += n.vy;
      if (n.x < 0 || n.x > cv.width) n.vx *= -1;
      if (n.y < 0 || n.y > cv.height) n.vy *= -1;
      for (var j = i + 1; j < N; j++) {
        var m = nodes[j], dx = n.x - m.x, dy = n.y - m.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d < D) {
          cx.strokeStyle = 'rgba(167,139,250,' + ((1 - d / D) * .5) + ')';
          cx.lineWidth = .7;
          cx.beginPath(); cx.moveTo(n.x, n.y); cx.lineTo(m.x, m.y); cx.stroke();
        }
      }
      var mdx = n.x - mouse.x, mdy = n.y - mouse.y, md = Math.sqrt(mdx * mdx + mdy * mdy);
      if (md < 210) {
        cx.strokeStyle = 'rgba(250,178,25,' + ((1 - md / 210) * .85) + ')';
        cx.lineWidth = 1.1;
        cx.beginPath(); cx.moveTo(n.x, n.y); cx.lineTo(mouse.x, mouse.y); cx.stroke();
      }
      cx.fillStyle = 'rgba(167,139,250,.85)';
      cx.beginPath(); cx.arc(n.x, n.y, n.r, 0, Math.PI * 2); cx.fill();
    }
    requestAnimationFrame(draw);
  }
  if (!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) draw();
})();

/* ميل الكارد ثلاثي الأبعاد */
(function () {
  var card = document.getElementById('loginCard');
  card.addEventListener('mousemove', function (e) {
    var r = card.getBoundingClientRect();
    var rx = ((e.clientY - (r.top + r.height / 2)) / (r.height / 2)) * -9;
    var ry = ((e.clientX - (r.left + r.width / 2)) / (r.width / 2)) * 9;
    card.style.transition = 'transform .06s';
    card.style.transform = 'perspective(900px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) scale(1.02)';
  });
  card.addEventListener('mouseleave', function () {
    card.style.transition = 'transform .6s cubic-bezier(.22,1,.36,1)';
    card.style.transform = 'perspective(900px) rotateX(0) rotateY(0) scale(1)';
  });
})();

/* إظهار/إخفاء كلمة المرور + تحذير الحروف الكبيرة */
(function () {
  var pw = document.getElementById('pwInput'), tg = document.getElementById('pwToggle');
  var eyeO = document.getElementById('pwEyeOpen'), eyeC = document.getElementById('pwEyeClosed');
  var caps = document.getElementById('capsWarn');
  tg.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eyeO.style.display = show ? 'none' : '';
    eyeC.style.display = show ? '' : 'none';
    tg.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
  });
  function checkCaps(e) {
    if (e.getModifierState) caps.classList.toggle('show', e.getModifierState('CapsLock'));
  }
  pw.addEventListener('keydown', checkCaps);
  pw.addEventListener('keyup', checkCaps);
  pw.addEventListener('blur', function () { caps.classList.remove('show'); });
})();

/* التحقق والدخول */
(function () {
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('signBtn');
  var label = btn.querySelector('.btn-label');
  var errBox = document.getElementById('errBox');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var u = document.getElementById('userIn').value.trim().toLowerCase();
    var p = document.getElementById('pwInput').value;
    btn.classList.add('loading'); btn.disabled = true; label.textContent = 'جاري الدخول…';
    errBox.classList.remove('show');
    setTimeout(function () {
      var rec = USERS[u];
      if (rec && rec.pass === p) {
        try {
          sessionStorage.setItem('egary-user', JSON.stringify({
            u: u, name: rec.name, role: rec.role, roleLabel: rec.roleLabel,
          }));
        } catch (err) {
          /* المتصفح رافض يحفظ الجلسة — نوضّح بدل ما نرميه في حلقة رجوع صامتة */
          btn.classList.remove('loading'); btn.disabled = false; label.textContent = 'دخول';
          errBox.textContent = 'تعذَّر حفظ الجلسة — فعِّل تخزين المتصفح أو اخرج من وضع التصفح الخاص ثم أعد المحاولة';
          errBox.classList.remove('show');
          void errBox.offsetWidth;
          errBox.classList.add('show');
          return;
        }
        location.replace('index.html');
      } else {
        btn.classList.remove('loading'); btn.disabled = false; label.textContent = 'دخول';
        errBox.classList.remove('show');
        void errBox.offsetWidth; /* يعيد تشغيل اهتزاز الخطأ */
        errBox.classList.add('show');
        document.getElementById('pwInput').select();
      }
    }, 650);
  });
})();
</script>
</body>
</html>
